name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Publish to npm
        run: |
          # npm's publish is asynchronous and the registry may not answer for a
          # while ("Your package is being processed"). A retry in that window
          # fails E409 "Cannot publish over previously staged version", and a
          # rerun of an already-published tag fails the same way — neither means
          # the release is broken, so both are only accepted when the exact
          # version is on the registry.
          if npm publish; then
            exit 0
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "dsh-cache-miss@${VERSION}" version >/dev/null 2>&1; then
            echo "dsh-cache-miss@${VERSION} is already on the registry; treating the failed publish as a retry."
            exit 0
          fi
          echo "npm publish failed and dsh-cache-miss@${VERSION} is not on the registry"
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build versionless release tarball
        run: pnpm pack:latest

      - name: Create GitHub Release
        run: |
          # A rerun finds the release from the first attempt; that is success too.
          gh release create "$GITHUB_REF_NAME" "dsh-cache-miss.tgz" --repo "$GITHUB_REPOSITORY" --generate-notes \
            || gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}